<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login | TalentIQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .card {
            width: 430px; background: white; padding: 50px;
            border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center;
        }
        .logo { font-size: 28px; font-weight: 900; color: #2563eb; margin-bottom: 6px; }
        .tagline { font-size: 14px; color: #6b7280; margin-bottom: 35px; }

        .field-group { text-align: left; margin-bottom: 18px; }
        .field-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 7px; }
        input {
            width: 100%; padding: 13px 15px; border-radius: 12px;
            border: 1px solid #d1d5db; font-size: 14px; outline: none; transition: 0.2s;
        }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }

        button {
            width: 100%; padding: 14px; border: none; border-radius: 14px;
            background: linear-gradient(to right, #2563eb, #1d4ed8);
            color: white; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.25s;
            margin-top: 8px;
        }
        button:hover { opacity: 0.92; transform: scale(1.01); }

        .error {
            background: #fee2e2; color: #991b1b; padding: 12px;
            border-radius: 12px; font-size: 13px; margin-bottom: 20px;
            border: 1px solid #fca5a5;
        }
        .info {
            background: #dbeafe; color: #1e40af; padding: 12px;
            border-radius: 12px; font-size: 13px; margin-bottom: 20px;
        }
        .footer { margin-top: 22px; font-size: 13px; color: #555; }
        .footer a { color: #2563eb; font-weight: 700; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        .back-home { display: block; margin-top: 12px; font-size: 12px; color: #9ca3af; text-decoration: none; }
        .back-home:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">TalentIQ</div>
        <div class="tagline">AI-Powered Bias-Free Resume Screening</div>

        {% if session.get("user") %}
            <div class="info">Already logged in as <b>{{ session["user"] }}</b>.</div>
            {% if session.get("role") == "hr" %}
                <a href="/hr"><button>Go to HR Dashboard →</button></a>
            {% else %}
                <a href="/candidate"><button>Go to Candidate Dashboard →</button></a>
            {% endif %}

        {% else %}
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="field-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="field-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit">Login →</button>
            </form>

            <div class="footer">
                Don't have an account? <a href="/signup">Sign up</a>
            </div>
            <a href="/" class="back-home">← Back to Home</a>
        {% endif %}
    </div>
</body>
</html>
